x-app-env: &app-env
  APP_KEY: "${APP_KEY:-}"
  APP_ENV: "${APP_ENV:-production}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-http://localhost:8000}"
  BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"
  CACHE_STORE: "${CACHE_STORE:-redis}"
  DB_CONNECTION: "${DOCKER_DB_CONNECTION:-mysql}"
  DB_HOST: "${DOCKER_DB_HOST:-mysql}"
  DB_PORT: "${DOCKER_DB_PORT:-3306}"
  DB_DATABASE: "${DOCKER_DB_DATABASE:-ngwe_lwe_laravel}"
  DB_USERNAME: "${DOCKER_DB_USERNAME:-ngwe_lwe}"
  DB_PASSWORD: "${DOCKER_DB_PASSWORD:-ngwe_lwe_secret}"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
  SESSION_DRIVER: "${SESSION_DRIVER:-file}"
  LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  REDIS_CLIENT: "${REDIS_CLIENT:-predis}"
  REDIS_HOST: "${REDIS_HOST:-redis}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
  REVERB_APP_ID: "${REVERB_APP_ID:-}"
  REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  REVERB_APP_SECRET: "${REVERB_APP_SECRET:-}"
  REVERB_SERVER_HOST: "${DOCKER_REVERB_SERVER_HOST:-0.0.0.0}"
  REVERB_SERVER_PORT: "${DOCKER_REVERB_SERVER_PORT:-8080}"
  REVERB_HOST: "${DOCKER_REVERB_HOST:-reverb}"
  REVERB_PORT: "${DOCKER_REVERB_PORT:-8080}"
  REVERB_SCHEME: "${REVERB_SCHEME:-http}"
  REVERB_ALLOWED_ORIGINS: "${REVERB_ALLOWED_ORIGINS:-*}"
  VITE_REVERB_APP_KEY: "${VITE_REVERB_APP_KEY:-}"
  VITE_REVERB_HOST: "${DOCKER_VITE_REVERB_HOST:-localhost}"
  VITE_REVERB_PORT: "${DOCKER_VITE_REVERB_PORT:-8080}"
  VITE_REVERB_SCHEME: "${DOCKER_VITE_REVERB_SCHEME:-http}"

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-ngwe_lwe_laravel}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-ngwe_lwe}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-ngwe_lwe_secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-root_secret}"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    restart: "no"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_DATABASE: "${TEST_DB_DATABASE:-ngwe_lwe_laravel_test}"
      MYSQL_USER: "${TEST_DB_USERNAME:-ngwe_lwe_test}"
      MYSQL_PASSWORD: "${TEST_DB_PASSWORD:-ngwe_lwe_test_secret}"
      MYSQL_ROOT_PASSWORD: "${TEST_DB_ROOT_PASSWORD:-root_test_secret}"
    ports:
      - "${MYSQL_TEST_HOST_PORT:-3308}:3306"
    tmpfs:
      - /var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  app:
    build: .
    image: ngwe-lwe-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_HOST_PORT:-8000}:${APP_SERVER_PORT:-8000}"
    environment:
      <<: *app-env
      APP_SERVER_HOST: "${APP_SERVER_HOST:-0.0.0.0}"
      APP_SERVER_PORT: "${APP_SERVER_PORT:-8000}"
      VITE_APP_NAME: "${VITE_APP_NAME:-Ngwe Lwe System}"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${APP_SERVER_PORT:-8000}/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  reverb:
    build: .
    image: ngwe-lwe-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    command: sh -lc "/app/docker/ensure-env.sh && php artisan reverb:start --host=$${REVERB_SERVER_HOST:-0.0.0.0} --port=$${REVERB_SERVER_PORT:-8080}"
    ports:
      - "${DOCKER_REVERB_HOST_PORT:-8080}:${DOCKER_REVERB_SERVER_PORT:-8080}"
    environment:
      <<: *app-env
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", (int) (getenv(\"REVERB_SERVER_PORT\") ?: 8080)) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
